title: Encoded PowerShell Execution (T1059.001)
id: 8b2e4c1a-9f3d-4e7b-a1c2-5d6e7f8a9b0c
status: test
description: Detects PowerShell executed with encoded command-line arguments, matching Atomic Red Team T1059.001 Test 17.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.001/T1059.001.md
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cli:
        CommandLine|contains:
            - ' -e '
            - ' -ec '
            - ' -en '
            - ' -enc '
            - ' -EncodedCommand '
filter_main_admin:
        ParentImage|contains:
            - '\CcmExec.exe'
            - '\ansible-runner\'
    condition: all of selection_* and not filter_main_*
  falsepositives:
    - Legitimate administrative scripts using Base64 encoding deployed via SCCM or automation frameworks.
